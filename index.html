<!doctype html>
<html lang="en">
  <head>
    <link rel="stylesheet" href="reset.css" />
    <link rel="stylesheet" href="index.css" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CRC Visualizer</title>
  </head>
  <body>
    <div class="app-container">
      <div class="header">
        <h1>CRC Visualization</h1>
        <p>Cyclic Redundancy Check</p>
      </div>
      <div class="send-tab">
        <div class="parameter-inputs">
          <input
            type="text"
            name="data"
            id="data"
            placeholder="Data Frame (0 and 1)"
            oninput="this.value = this.value.replace(/[^01]/g, '')"
          />
          <input
            type="text"
            name="generator"
            id="generator"
            placeholder="Generator (0 and 1)"
            oninput="this.value = this.value.replace(/[^01]/g, '')"
          />
          <div>
            <p class="error"></p>
            <button class="start-btn" onclick="startVisualization()">Start</button>
          </div>
        </div>
        <div class="calculation-space">
          <div class="extracted-data"></div>
          <div class="extracted-generator"></div>
          <div class="divider-line"></div>
          <div class="remainder"></div>
          <div class="checksum hide"></div>
          <div class="checksum-label hide">checksum</div>
        </div>
      </div>
    </div>
    <script src="index.js"></script>
  </body>
</html>
